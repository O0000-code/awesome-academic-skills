# Scheduled refresh of CI-maintained metadata (modelled on awesome-claude-code's
# update-repo-ticker + selfhosted's daily-update-metadata). Fills stargazers_count
# / updated_at / archived / current_release from the GitHub API, regenerates the
# READMEs from the refreshed data, and commits the result. Author-supplied fields
# are never touched. Every action pinned to a full commit SHA.
name: update-metadata

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC (off-peak; fast-moving field)
  workflow_dispatch: {}

permissions:
  contents: write        # writes the refresh onto its own branch
  pull-requests: write   # opens/updates the single rolling refresh PR

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.3.0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: make install

      - name: Refresh metadata from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make update_metadata

      - name: Regenerate READMEs
        run: make generate

      # main is a protected branch and this is a personal repository, where classic
      # branch protection cannot grant bypass allowances (they are organization-only,
      # verified: HTTP 422 "Only organization repositories can have users and team
      # restrictions"). github-actions[bot] is not an admin, so a direct push to main
      # is rejected with GH006. The refresh therefore lands on its own branch and is
      # offered as ONE rolling pull request that this job keeps up to date — the same
      # single-tracker shape the sweep workflows use for their issues.
      #
      # peter-evans/create-pull-request v8.1.1 (pinned).
      - name: Open/update the rolling metadata PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: |
            data/
            README.md
            README.zh-CN.md
          branch: chore/metadata-refresh
          delete-branch: false
          commit-message: "chore: daily metadata refresh + regenerated READMEs"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          title: "chore: metadata refresh (rolling)"
          labels: maintenance
          body: |
            Automated refresh of the CI-maintained fields — `stargazers_count`,
            `updated_at`, `archived`, `current_release` — pulled from the GitHub API,
            with the READMEs regenerated from the refreshed data. Author-supplied
            fields are never touched.

            **This is a single rolling PR.** Every daily run force-updates this branch
            rather than opening a new one, so it always shows the current delta against
            `main`. Merging it is safe at any time; leaving it open just means the
            published star counts lag by however long it sits.

            Because GitHub does not run workflows on commits pushed with `GITHUB_TOKEN`,
            the required `validate` check will not report on this PR by itself. Merge it
            with an admin override (`gh pr merge --admin --squash`), or re-run the checks
            by closing and reopening the PR from a user account.
