description: Restricts an agent's literature search to full text from a fixed set
  of peer-reviewed venues and returns a verbatim supporting quote for each verified
  claim. Strong on ML and security; indexes nothing else, so not a general search.
description_zh: 将智能体的文献检索限定在固定的同行评审场所全文范围内，核查论断时返回论文中的原文引句。机器学习与安全方向覆盖较好；索引场所之外没有任何内容，因此不能当作通用学术搜索使用。
homepage_url: https://luneresearch.com
