name: de-anthropocentric-research-engine
slug: de-anthropocentric-research-engine
source_url: https://github.com/yogsoth-ai/de-anthropocentric-research-engine
author: yogsoth-ai
author_url: https://github.com/yogsoth-ai
license: Apache-2.0
category: Autonomous Research Systems
lifecycle_stage: autonomous
type: suite
description: Runs literature synthesis, gap validation, hypothesis formation and experiment design from a stated direction; approves its staged plan first, walks back to the literature when evidence cannot carry an experiment, and stops before drafting a paper.
description_zh: 给定研究方向后自行完成文献综合、空白验证、假设形成与实验设计；执行前先审批分阶段计划，证据不足以支撑实验时退回文献，不涉及论文起草。
security:
  makes_network_calls: false
  has_hooks: false
  requires_bypass_permissions: false
  telemetry: false
  auto_update: false
  depends_3rdparty: false
  allowed_tools_scoped: true
validate_claim: Give the engine a research direction in a domain you know, and check that the Research Spec it drafts is approved before any search runs; reject one stage, then interrupt a run and confirm it resumes at the last complete checkpoint rather than restarting. The requested outcome is a tested-or-rejected hypothesis with an auditable trail, not a drafted paper.
subcategory: Fully autonomous auto-scientists
current_release:
  tag: v4.0.0
  published_at: '2026-09-25'
